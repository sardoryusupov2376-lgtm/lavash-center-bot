<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavash Center - Mini App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- TODO: Telegram WebApp API script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Header -->
    <header class="header">
        <h1>🍕 Lavash Center</h1>
        <button class="cart-btn" id="cartBtn">🛒 Savat (0)</button>
    </header>
    
    <!-- Main content -->
    <main class="main">
        <!-- Categories -->
        <div class="categories" id="categories"></div>
        
        <!-- Products -->
        <div class="products" id="products"></div>
    </main>
    
    <!-- Shopping Cart Modal -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <button class="close-btn" id="closeCartBtn">✕</button>
            <h2>🛒 Savat</h2>
            <div id="cartItems"></div>
            <div class="cart-summary">
                <p>Jami: <span id="totalPrice">0 so'm</span></p>
                <p>Chegirma: <span id="discountAmount">0 so'm</span></p>
                <p class="final">Final: <span id="finalPrice">0 so'm</span></p>
            </div>
            <button class="btn-primary" id="checkoutBtn">Zakaya qilish</button>
        </div>
    </div>
    
    <!-- Checkout Modal -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <h2>📍 Lokatsiya va kontakt</h2>
            <!-- TODO: Location input, phone input, promo code input -->
            <button class="btn-primary" id="paymentBtn">To'lovga o'tish</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
