version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: lavash_db
      POSTGRES_USER: lavash_user
      POSTGRES_PASSWORD: secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  bot:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://lavash_user:secure_password@postgres:5432/lavash_db
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_ID: ${ADMIN_ID}
    restart: always

volumes:
  postgres_data: